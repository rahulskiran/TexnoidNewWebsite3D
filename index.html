<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/brand/logo-mark.png" />
    <link rel="apple-touch-icon" href="/assets/brand/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texnoid™ — Best Website Design & Development Agency</title>
    <meta name="description" content="Texnoid is a leading website design and development agency, building fast, beautiful, 3D-enhanced websites and web apps for modern brands." />

    <!-- PLACEHOLDER domain: texnoid.com is already someone else's real business, so this uses
         texnoidsolutions.com (matching the Texnoid Solutions LLP name) until the real domain
         is confirmed. Update this canonical URL and every og:/twitter: url below to match. -->
    <link rel="canonical" href="https://www.texnoidsolutions.com/" />

    <!-- Open Graph / social preview cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Texnoid" />
    <meta property="og:title" content="Texnoid™ — Best Website Design & Development Agency" />
    <meta property="og:description" content="Texnoid is a leading website design and development agency, building fast, beautiful, 3D-enhanced websites and web apps for modern brands." />
    <meta property="og:url" content="https://www.texnoidsolutions.com/" />
    <meta property="og:image" content="https://www.texnoidsolutions.com/assets/brand/logo-mark.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Texnoid™ — Best Website Design & Development Agency" />
    <meta name="twitter:description" content="Texnoid is a leading website design and development agency, building fast, beautiful, 3D-enhanced websites and web apps for modern brands." />
    <meta name="twitter:image" content="https://www.texnoidsolutions.com/assets/brand/logo-mark.png" />

    <!-- Structured data: tells Google this is a business (Organization), which is what makes a
         search result show a richer overview (logo, description, links) instead of a plain
         blue link. PLACEHOLDER phone/address: confirm before launch. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Texnoid",
        "legalName": "Texnoid Solutions LLP",
        "url": "https://www.texnoidsolutions.com/",
        "logo": "https://www.texnoidsolutions.com/assets/brand/logo-mark.png",
        "image": "https://www.texnoidsolutions.com/assets/brand/logo-mark.png",
        "description": "Texnoid is a website design and development agency building fast, beautiful, 3D-enhanced websites, web apps and e-commerce stores for modern brands.",
        "telephone": "+91-8341814583",
        "sameAs": []
      }
    </script>

    <!-- Google Fonts: Anton, Big Shoulders Display, Plus Jakarta Sans, Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Big+Shoulders+Display:wght@700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>

  </body>
